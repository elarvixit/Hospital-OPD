<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elarvix OPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // Apply the saved theme (or the phone/PC setting) before the page paints — no white flash.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('opd.theme')); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e8f8b'/%3E%3Cpath d='M4 17h6l3-7 4 13 3-6h8' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <div class="brand-logo">
          <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17h6l3-7 4 13 3-6h10" opacity="0.35" />
            <path class="ecg" d="M3 17h6l3-7 4 13 3-6h10" />
          </svg>
        </div>
        <div>
          <h1>Elarvix OPD</h1>
          <p>Outpatient queue &amp; appointments</p>
        </div>
      </a>
      <div class="topbar-right">
        <div class="clock"><span class="live-dot"></span><span id="clock" class="mono">--:--</span></div>
        <div class="role-switch">
          <select id="role" class="select" aria-label="Role">
            <option value="desk">Front desk</option>
            <option value="doctor">Doctor</option>
          </select>
          <select id="doctorSelect" class="select" aria-label="Doctor" hidden></select>
        </div>
        <button class="btn theme-toggle" id="themeToggle" type="button" title="Switch to dark mode" aria-label="Switch to dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <a class="btn btn-sm display-link" href="display.html" target="_blank" rel="noopener" title="Open the waiting-area screen" aria-label="Waiting display">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Waiting display</span>
        </a>
      </div>
    </div>
    <div class="tabs-wrap"><nav class="tabs" id="tabs"></nav></div>
  </header>

  <main id="app"></main>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
